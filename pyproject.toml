[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "castcut"
version = "0.1.0"
description = "Agent-first lure fishing vlog editing pipeline (triage, rough cut, fine cut, zero-VIP NLE handoff) for Antigravity and Codex."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "imageio-ffmpeg>=0.5.1",
  "pillow>=10.3.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.0.3",
]
mcp = [
  "mcp>=1.2.0",
]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.8.0",
]

[project.scripts]
castcut = "castcut.cli:app"
castcut-mcp = "castcut.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/castcut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
